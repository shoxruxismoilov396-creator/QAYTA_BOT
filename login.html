<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QAYTA — Kirish</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="logo">♻️ QAYTA</div>
    <h1>Admin panel</h1><p class="muted">Boshqaruv paneliga kirish</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <label>Login</label><input name="username" required autocomplete="username">
      <label>Parol</label><input type="password" name="password" required autocomplete="current-password">
      <button class="primary full" type="submit">Kirish</button>
    </form>
  </main>
</body></html>
